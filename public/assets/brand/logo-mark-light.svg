<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Pizza Wave Official Mark (Light Variant for Dark Surfaces) -->
  <defs>
    <linearGradient id="pw-light-grad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FD7E3B"/>
      <stop offset="100%" stop-color="#FDCC3B"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="128" fill="#4D0711"/>

  <!-- Wave Crust (Top Arch) -->
  <path d="M104 156 C 180 108, 332 108, 408 156 C 418 162, 420 178, 408 186 C 364 216, 308 208, 256 196 C 204 184, 148 180, 104 186 C 92 178, 94 162, 104 156 Z" fill="#FDCC3B" stroke="#FEFEF6" stroke-width="12" stroke-linejoin="round"/>

  <!-- Main Pizza Slice Body flowing into Ocean Wave Crest -->
  <path d="M112 184 Q 256 220 400 184 L 274 424 C 266 440 246 440 238 424 L 112 184 Z" fill="#FEFEF6" stroke="#FEFEF6" stroke-width="10" stroke-linejoin="round"/>

  <!-- Cheese Wave Flow Layer -->
  <path d="M124 200 C 180 236, 230 200, 276 228 C 322 256, 360 216, 388 200 L 256 410 Z" fill="#FDCC3B"/>

  <!-- Ocean Wave Ripple Overlay -->
  <path d="M136 215 C 190 252, 226 230, 268 250 C 310 270, 344 240, 376 215 C 330 300, 285 360, 256 410 C 227 360, 182 300, 136 215 Z" fill="#FD7E3B"/>

  <!-- Wave / Pepperoni Motifs -->
  <circle cx="216" cy="272" r="24" fill="#BD1F17" stroke="#FEFEF6" stroke-width="6"/>
  <circle cx="296" cy="296" r="20" fill="#BD1F17" stroke="#FEFEF6" stroke-width="5"/>
  <circle cx="240" cy="344" r="16" fill="#BD1F17" stroke="#FEFEF6" stroke-width="5"/>

  <!-- Steam / Ocean Crest Accent Dots -->
  <circle cx="160" cy="116" r="10" fill="#FEFEF6"/>
  <circle cx="256" cy="96" r="14" fill="#FDCC3B"/>
  <circle cx="352" cy="116" r="10" fill="#FEFEF6"/>
</svg>
